services:
  safety-router-api:
    build: ./llm-multiroute
    ports:
      - "8080:8080"
    environment:
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.4}
      OLLAMA_MODEL_CLASSIFY: ${OLLAMA_MODEL_CLASSIFY:-gemma3:4b}
      OLLAMA_MODEL_SENTIMENT: ${OLLAMA_MODEL_SENTIMENT:-llama3.2}
      OLLAMA_MODEL_SUMMARIZE: ${OLLAMA_MODEL_SUMMARIZE:-mistral}
      OLLAMA_MODEL_INTENT: ${OLLAMA_MODEL_INTENT:-qwen2.5}
      GUARDRAILS_BLOCK_SECRETS: ${GUARDRAILS_BLOCK_SECRETS:-true}
    networks:
      - safety-network

  safety-router-web:
    build: ./llm-frontend-python
    ports:
      - "5000:5000"
    environment:
      BACKEND_URL: http://safety-router-api:8080
      FLASK_PORT: 5000
      FLASK_DEBUG: "false"
    depends_on:
      - safety-router-api
    networks:
      - safety-network

networks:
  safety-network:
    driver: bridge
