name: Safety Router API CI

on:
  push:
    branches: [main]
    paths:
      - 'llm-multiroute/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'llm-multiroute/**'
      - '.github/workflows/api-ci.yml'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-multiroute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: llm-multiroute/requirements.txt
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
          ruff check app tests
          pytest tests -v --tb=short

  container:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: svemaha321/llm-safety-router-api
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: llm-multiroute
          load: true
          tags: svemaha321/llm-safety-router-api:scan
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'
        with:
          image-ref: svemaha321/llm-safety-router-api:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: svemaha321
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: llm-multiroute
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
